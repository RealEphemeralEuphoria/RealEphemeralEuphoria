<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title description">
  <title id="title">Dalamud release workflow</title>
  <desc id="description">A release workflow moves plugin versions through manifest calculation, minimal updates, and promotion between testing and stable channels.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/>
    </marker>
    <style><![CDATA[
      :root { --canvas: #f6f8fa; --panel: #ffffff; --border: #d0d7de; --ink: #24292f; --muted: #57606a; }
      @media (prefers-color-scheme: dark) { :root { --canvas: #0d1117; --panel: #161b22; --border: #30363d; --ink: #f0f6fc; --muted: #8b949e; } }
      .canvas { fill: var(--canvas); }
      .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.25; }
      .eyebrow { fill: #0e7490; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.8px; }
      .label { fill: var(--muted); font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.25px; }
      .body { fill: var(--ink); font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail { fill: var(--muted); font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    ]]></style>
  </defs>

  <rect class="canvas" width="1200" height="220" rx="20"/>
  <text class="eyebrow" x="48" y="42">RELEASE AUTOMATION</text>
  <g fill="none" stroke="#0e7490" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)">
    <path d="M286 133H356"/>
    <path d="M566 133H636"/>
    <path d="M846 133H916"/>
  </g>

  <g>
    <rect class="panel" x="48" y="88" width="238" height="88" rx="16"/>
    <text class="label" x="72" y="117">PLUGIN VERSION</text>
    <text class="body" x="72" y="145">Read release intent</text>
    <text class="detail" x="72" y="163">source metadata</text>
  </g>
  <g>
    <rect class="panel" x="356" y="88" width="210" height="88" rx="16"/>
    <text class="label" x="380" y="117">MANIFEST</text>
    <text class="body" x="380" y="145">Compute metadata</text>
    <text class="detail" x="380" y="163">repeatable output</text>
  </g>
  <g>
    <rect class="panel" x="636" y="88" width="210" height="88" rx="16"/>
    <text class="label" x="660" y="117">UPDATE</text>
    <text class="body" x="660" y="145">Preserve small diffs</text>
    <text class="detail" x="660" y="163">reviewable changes</text>
  </g>
  <g>
    <rect class="panel" x="916" y="88" width="236" height="88" rx="16"/>
    <text class="label" x="940" y="117">PROMOTION</text>
    <text class="body" x="940" y="145">Testing → stable</text>
    <text class="detail" x="940" y="163">reusable release paths</text>
  </g>
</svg>
